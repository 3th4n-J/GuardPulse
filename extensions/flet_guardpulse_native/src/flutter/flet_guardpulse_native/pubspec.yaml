name: flet_guardpulse_native
description: GuardPulse enforcement layer (DNS-filter VPN) as a Flet service
version: 0.6.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  flet: 1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: za.co.guardpulse.shield
        pluginClass: GuardPulseShieldPlugin
